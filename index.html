<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>

    <link rel="stylesheet" href="app.css">
</head>
<body>

    <!-- Score of Quiz -->
    <div class="score">
        Score:
        <span id="right-answers">0</span>
    </div>

    <!-- Quiz Container -->
    <div class="container">

        <!-- Question Section -->
        <div id="question-container" class="hide">

            <div id="question">
                Question will appear here
            </div>

            <div id="answer-buttons" class="btn-grid">
                <!-- JavaScript will create the answer buttons here -->
            </div>

        </div>

        <!-- Control Buttons -->
        <div class="controls">
            <button id="start-btn" class="start-btn">
                Start Quiz
            </button>

            <button id="next-btn" class="next-btn hide">
                Next Question
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
